<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CodeBox · Solve</title>
    <!-- marked + DOMPurify must load before Monaco's AMD loader, or their UMD
         bundles register as AMD modules instead of globals. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
    <script src="https://unpkg.com/monaco-editor@0.56.0/min/vs/loader.js"></script>
    <script src="common.js" defer></script>
    <script src="solve.js" defer></script>
    <script src="chat.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css.css" />
  </head>
  <body class="practice-page">
    <div id="app-layout">
      <div id="sidebar">
        <div id="sidebar-header">
          <a id="home-link" href="runcodebox.html"
            ><i class="bi bi-box"></i> CodeBox</a
          >
          <button id="info-icon" onclick="toggleInfoPopup()" title="Help (Ctrl/⌘ + I)" aria-label="Help">
            <i class="bi bi-info-lg"></i>
          </button>
        </div>
        <nav id="page-nav">
          <a href="solve.html" class="active"
            ><i class="bi bi-puzzle"></i> Solve</a
          >
          <a href="study.html"
            ><i class="bi bi-journal-code"></i> Study</a
          >
        </nav>
        <h3>Problems</h3>
        <div id="practice-filters"></div>
        <div id="practice"></div>
      </div>

      <div id="collapsible-panel">
        <div id="collapsible-content">
          <h4>Details</h4>
          <div id="file-info">
            <p><em>Select a problem to view details</em></p>
          </div>
        </div>
        <div id="panel-resize-handle"></div>
      </div>

      <button id="collapse-toggle" onclick="togglePanel()">
        <i class="bi bi-chevron-left" id="collapse-icon"></i>
      </button>

      <div id="main">
        <div id="controls">
          <span id="currentFile">No problem selected</span>
          <div id="actions">
            <button id="download-btn" class="secondary" onclick="downloadCode()" title="Download (Ctrl/⌘ + S)" aria-label="Download">
              <i class="bi bi-download"></i>
            </button>
            <button id="reset-btn" class="secondary" onclick="resetCode()">
              <i class="bi bi-arrow-counterclockwise"></i>
              Reset
            </button>
            <button id="test-btn" onclick="runTests()">
              <i class="bi bi-check2-square"></i>
              Run tests
            </button>
            <button id="run-btn" onclick="runCode()">
              <i class="bi bi-play-fill"></i>
              Run
            </button>
          </div>
        </div>
        <div id="editor"></div>
        <pre id="output"></pre>
      </div>

      <aside id="chat-panel">
        <button id="chat-expand" onclick="toggleChatPanel()" title="Show the mentor" aria-label="Show the mentor">
          <i class="bi bi-chevron-left"></i>
          <span><i class="bi bi-chat-dots"></i> Mentor</span>
        </button>
        <div id="chat-header">
          <span><i class="bi bi-chat-dots"></i> Mentor</span>
          <span id="chat-header-actions">
            <button
              id="chat-hint"
              onclick="requestHint()"
              title="Unlock the next, stronger hint"
            >
              <i class="bi bi-lightbulb"></i> Hint
              <span id="chat-hint-level">0/5</span>
            </button>
            <button
              id="chat-clear"
              onclick="clearChat()"
              title="Clear conversation (unlocked hints stay unlocked)"
            >
              <i class="bi bi-trash"></i>
            </button>
            <button
              id="chat-collapse"
              onclick="toggleChatPanel()"
              title="Hide the mentor"
              aria-label="Hide the mentor"
            >
              <i class="bi bi-chevron-right"></i>
            </button>
          </span>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-compose">
          <textarea
            id="chat-input"
            rows="3"
            placeholder="Ask the mentor… (Enter to send, Shift+Enter for a new line)"
          ></textarea>
          <button id="chat-send" onclick="onChatSendClick()" title="Send">
            <i class="bi bi-send"></i>
          </button>
        </div>
      </aside>
    </div>

    <div id="info-popup"></div>
  </body>
</html>
