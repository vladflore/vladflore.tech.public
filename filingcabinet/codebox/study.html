<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CodeBox · Study</title>
    <script src="https://unpkg.com/monaco-editor@0.56.0/min/vs/loader.js"></script>
    <script src="common.js" defer></script>
    <script src="study.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css.css" />
  </head>
  <body>
    <!-- <div id="status-banner" role="alert" aria-live="polite">
      ⚠️ As of 15.02.2026 code execution is not possible anymore because the
      public Piston API is no longer available. Please test your code locally,
      while I explore alternative solutions for code execution. Thank you for
      your understanding!
    </div> -->

    <div id="app-layout">
      <div id="sidebar">
        <div id="sidebar-header">
          <a id="home-link" href="runcodebox.html"
            ><i class="bi bi-box"></i> CodeBox</a
          >
          <button id="info-icon" onclick="toggleInfoPopup()" title="Help (Ctrl/⌘ + I)" aria-label="Help">
            <i class="bi bi-info-lg"></i>
          </button>
        </div>
        <nav id="page-nav">
          <a href="solve.html"><i class="bi bi-puzzle"></i> Solve</a>
          <a href="study.html" class="active"
            ><i class="bi bi-journal-code"></i> Study</a
          >
        </nav>
        <h3>
          Files
          <span
            id="file-counts"
            style="font-size: 14px; color: #888; font-weight: normal"
            >(0 total)</span
          >
        </h3>
        <div id="search-container">
          <input
            type="text"
            id="search-input"
            placeholder="Search files..."
            onkeyup="handleSearchKeyup(event)"
            oninput="handleSearchInput()"
          />
          <button id="search-btn" onclick="searchFiles()">
            <i class="bi bi-search"></i>
          </button>
          <button id="clear-search" onclick="clearSearch()">
            <i class="bi bi-x"></i>
          </button>
        </div>
        <div id="files"></div>
      </div>

      <div id="collapsible-panel">
        <div id="collapsible-content">
          <h4>Details</h4>
          <div id="file-info">
            <p><em>Select a file to view details</em></p>
          </div>
        </div>
        <div id="panel-resize-handle"></div>
      </div>

      <button id="collapse-toggle" onclick="togglePanel()">
        <i class="bi bi-chevron-left" id="collapse-icon"></i>
      </button>

      <div id="main">
        <div id="controls">
          <span id="currentFile">No file selected</span>
          <div id="actions">
            <button id="download-btn" class="secondary" onclick="downloadCode()" title="Download (Ctrl/⌘ + S)" aria-label="Download">
              <i class="bi bi-download"></i>
            </button>
            <button id="reset-btn" class="secondary" onclick="resetCode()" title="Undo your edits: back to the original solution">
              <i class="bi bi-arrow-counterclockwise"></i>
              Reset
            </button>
            <button id="run-btn" onclick="runCode()">
              <i class="bi bi-play-fill"></i>
              Run
            </button>
          </div>
        </div>
        <div id="editor"></div>
        <pre id="output"></pre>
      </div>
    </div>

    <div id="info-popup"></div>
  </body>
</html>
