            <h1 class="post-title">Git</h1>

            <div class="quiz-toolbar" hidden><span class="quiz-reset-slot"></span></div>

            <div
                id="flashcards-app"
                class="quiz-app flashcards-app"
                data-deck-title="Git"
            ></div>

            <script type="application/json" id="flashcards-data">
                [
  {
    "back": "No. Every commit is a full snapshot of the project. Diffs are computed on demand, only for display.\n\nThat's why branching is cheap and checking out an old version never has to replay anything.",
    "front": "Does Git store the difference between commits, like a chain of patches?",
    "topic": "Big picture"
  },
  {
    "back": "- **Working directory**: the files on disk\n- **Staging area** (index): a draft of the next commit\n- **Repository** (`.git`): the permanent history",
    "front": "Which three places does every Git command move content between?",
    "topic": "Big picture"
  },
  {
    "back": "Some combination of three things: write an object, update a ref, or move `HEAD`.",
    "front": "What does every Git command boil down to, mechanically?",
    "topic": "Big picture"
  },
  {
    "back": "The file is in the working directory, but it's neither staged nor committed (untracked).",
    "front": "In `git status --short`, what does `??` next to a file mean?",
    "topic": "Three trees"
  },
  {
    "back": "- First column: staging area vs. the last commit (`A` = staged as new)\n- Second column: working directory vs. the staging area",
    "front": "In `git status --short`, what do the two columns describe?",
    "topic": "Three trees"
  },
  {
    "back": "- `git diff`: working directory vs. staging area\n- `git diff --staged`: staging area vs. the last commit",
    "front": "What is the difference between `git diff` and `git diff --staged`?",
    "topic": "Three trees"
  },
  {
    "back": "Each commit stores a pointer to its parent commit(s). Walk those pointers backward and you have the full history.\n\nNo separate log exists: the graph *is* the log.",
    "front": "How does Git know a commit's history? Where is the log stored?",
    "topic": "Commits \u0026 branches"
  },
  {
    "back": "A movable pointer to one commit, stored as a tiny text file holding a single commit hash:\n\n```\n.git/refs/heads/main\n```\n\nThere is no special \"branch\" object type.",
    "front": "Mechanically, what is a branch?",
    "topic": "Commits \u0026 branches"
  },
  {
    "back": "- `git branch \u003cname\u003e` creates a new ref file with the same commit hash as the current branch\n- `git branch -D \u003cname\u003e` deletes that file",
    "front": "What do `git branch \u003cname\u003e` and `git branch -D \u003cname\u003e` do at file level?",
    "topic": "Commits \u0026 branches"
  },
  {
    "back": "A branch, not a commit. `.git/HEAD` usually contains:\n\n```\nref: refs/heads/main\n```\n\n`git checkout \u003cbranch\u003e` rewrites that one line.",
    "front": "What does `HEAD` normally point to?",
    "topic": "Commits \u0026 branches"
  },
  {
    "back": "`HEAD` holds a raw commit hash instead of a `ref:` line. It happens when you check out a specific commit rather than a branch.",
    "front": "What is a detached `HEAD`?",
    "topic": "Commits \u0026 branches"
  },
  {
    "back": "It creates the new commit and drags the current branch pointer forward to it.",
    "front": "What does `git commit` do to the current branch?",
    "topic": "Commits \u0026 branches"
  },
  {
    "back": "No. It only moves `HEAD` to point at a different branch (and updates your working directory to match).",
    "front": "Does `git checkout \u003cbranch\u003e` touch any commit?",
    "topic": "Commits \u0026 branches"
  },
  {
    "back": "When the branch you're merging *into* hasn't moved since you branched off. There are no new commits on it, so there's nothing to combine.",
    "front": "When can `git merge feature` be a fast-forward merge?",
    "topic": "Merging"
  },
  {
    "back": "Git just slides the target branch's pointer forward to the tip of the merged branch. No merge commit is created.",
    "front": "What actually happens in a fast-forward merge?",
    "topic": "Merging"
  },
  {
    "back": "A **three-way merge**: Git finds the common ancestor, compares both tips against it, and creates a new commit with *two* parents, one from each branch.",
    "front": "Both branches gained commits since they diverged. What does `git merge` do?",
    "topic": "Merging"
  },
  {
    "back": "A regular commit that just happens to have two parent commits.",
    "front": "What is a merge commit, technically?",
    "topic": "Merging"
  },
  {
    "back": "The method Git uses to find the base commit and combine the changes. `git merge` picks one automatically unless you pass `-s`.\n\nThe post covers `recursive`; newer Git versions default to `ort`, its faster replacement.",
    "front": "What is a merge strategy?",
    "topic": "Merging"
  },
  {
    "back": "No, just good hygiene. `git branch -d feature` removes the pointer; the commits stay reachable through the branch you merged into.",
    "front": "Is deleting a branch after merging it required?",
    "topic": "Merging"
  },
  {
    "back": "A merge creates a new commit combining both histories.\n\nA rebase changes the **base** of a branch: it replays your commits on top of a different commit, so history stays linear.",
    "front": "How does a rebase integrate changes differently from a merge?",
    "topic": "Rebase"
  },
  {
    "back": "Git created three new commits (`F'0`, `F'1`, `F'2`) with identical content but different hashes, placed after the new base.\n\nThe originals get garbage-collected eventually, unless \"revived\" (e.g. via the reflog).",
    "front": "After `git rebase master` on `feature`, what happened to `F0`, `F1`, `F2`?",
    "topic": "Rebase"
  },
  {
    "back": "Fast-forward merge `feature` into `master`. That just moves the `master` pointer to the last rebased commit.",
    "front": "After rebasing `feature` onto `master`, `master` is still behind. How do you bring it up to date?",
    "topic": "Rebase"
  },
  {
    "back": "Takes the diff introduced by `F1` and replays it on top of the current branch tip, producing **one new commit** with the same changes but a different hash and parent.\n\nThe source branch is untouched.",
    "front": "What does `git cherry-pick F1` do?",
    "topic": "Cherry-pick"
  },
  {
    "back": "When you need one specific commit without the rest of its branch, for example backporting a bug fix to a release branch without pulling in unrelated work.",
    "front": "When is cherry-pick the right tool?",
    "topic": "Cherry-pick"
  },
  {
    "back": "By the SHA-1 hash of its own content.\n\nSame content anywhere in history means same hash, same object, stored once. That's what makes Git a **content-addressable** store.",
    "front": "How is every Git object named?",
    "topic": "Object database"
  },
  {
    "back": "- **blob**: file content\n- **tree**: a directory listing\n- **commit**: a tree plus metadata plus parent(s)",
    "front": "What are the three kinds of Git objects?",
    "topic": "Object database"
  },
  {
    "back": "Only raw file content. No filename, no permissions, no history. Filenames live in tree objects.",
    "front": "What does a blob object store?",
    "topic": "Object database"
  },
  {
    "back": "A directory listing, one line per entry: mode, object type, hash, filename.\n\nA file entry points at a blob; a subdirectory entry points at another tree.",
    "front": "What does a tree object contain?",
    "topic": "Object database"
  },
  {
    "back": "- the **tree** for the project's root directory\n- author, committer and timestamp\n- the message\n- a **parent** line pointing at the previous commit (absent for the first commit)",
    "front": "What does a commit object contain?",
    "topic": "Object database"
  },
  {
    "back": "Without `-w`, Git only prints the hash the content *would* get. With `-w`, it also writes the blob into `.git/objects`.\n\n`git add` does exactly this write step for you, then records the result in the staging area.",
    "front": "What is the difference between `git hash-object` and `git hash-object -w`?",
    "topic": "Object database"
  },
  {
    "back": "Nothing. Git only adds new objects (a blob, a tree, a commit) and points the new commit's `parent` at the old one. The branch and `HEAD` slide forward.",
    "front": "When you commit a second version of a file, what happens to the first commit?",
    "topic": "Object database"
  },
  {
    "back": "The first two characters of the hash become the subdirectory name, so `.git/objects` doesn't end up with tens of thousands of files in one place.",
    "front": "Why are objects stored as `.git/objects/14/f5f0b...` instead of one flat directory?",
    "topic": "Object database"
  },
  {
    "back": "Garbage collection packs many loose objects into a compressed **packfile**, storing similar objects as deltas against each other.\n\nThe object model doesn't change, the storage just gets far more efficient.",
    "front": "Every commit only adds objects. Why doesn't `.git` grow forever?",
    "topic": "Object database"
  },
  {
    "back": "A binary search through your history for the commit that introduced a bug. Mark one commit good and one bad, and Git repeatedly checks out the midpoint until it isolates the culprit.",
    "front": "What does `git bisect` automate?",
    "topic": "Bisect"
  },
  {
    "back": "```\ngit bisect start\ngit bisect bad \u003cbad-sha\u003e\ngit bisect good \u003cgood-sha\u003e\n```\n\nTest each commit Git checks out, then run `git bisect good` or `git bisect bad` until it names the first bad commit.",
    "front": "How do you run a manual bisect session?",
    "topic": "Bisect"
  },
  {
    "back": "By the script's exit code: `0` means good, non-zero means bad (`125` means \"skip this commit\").\n\nGit then checks out commits, runs the script, and marks them automatically.",
    "front": "How does `git bisect run \u003cscript\u003e` decide if a commit is good or bad?",
    "topic": "Bisect"
  },
  {
    "back": "`git bisect reset` closes the session and checks you back out to where you started.",
    "front": "How do you end a bisect session?",
    "topic": "Bisect"
  },
  {
    "back": "Every place `HEAD` and your branches have pointed to: commits, resets, checkouts, rebases, branch deletions. As long as the objects haven't been garbage-collected, you can recover from any of these moves.",
    "front": "What does `git reflog` record?",
    "topic": "Reflog"
  },
  {
    "back": "```\n027eae4 HEAD@{1}: commit: Update notes to v3\n```\n\n`\u003csha\u003e HEAD@{n}: \u003caction\u003e: \u003cdescription\u003e`. `HEAD@{n}` is a relative reference you can use anywhere a commit is expected.",
    "front": "How do you read a reflog line?",
    "topic": "Reflog"
  },
  {
    "back": "Find the commit in `git reflog`, then move the branch back to it:\n\n```\ngit reflog\ngit reset --hard HEAD@{1}\n```",
    "front": "You ran `git reset --hard HEAD~1` one commit too far. How do you get the commit back?",
    "topic": "Reflog"
  },
  {
    "back": "`HEAD`'s reflog still remembers every commit made while the branch was checked out. Find its last commit, then recreate the branch:\n\n```\ngit reflog\ngit branch \u003cname\u003e \u003csha\u003e\n```\n\n(`git branch -D` also prints the last sha when it deletes.)",
    "front": "You force-deleted an unmerged branch with `git branch -D`. How do you recover it?",
    "topic": "Reflog"
  },
  {
    "back": "Reflog entries expire after 90 days (`gc.reflogExpire`). Unreachable objects are pruned by `git gc` after 30 days (`gc.pruneExpire`).\n\nA safety net measured in weeks, not a backup strategy.",
    "front": "How long does the reflog keep entries?",
    "topic": "Reflog"
  },
  {
    "back": "- Commits you never had locally: it lives in `.git/logs` on your machine only, so it can't undo a teammate's force-push\n- Anything past its expiry\n- Fresh clones: they start with no reflog history",
    "front": "What can't the reflog save you from?",
    "topic": "Reflog"
  },
  {
    "back": "`git log` shows where you are (the history reachable from here). `git reflog` shows everywhere you've been.",
    "front": "`git log` vs. `git reflog`: what's the difference?",
    "topic": "Reflog"
  },
  {
    "back": "It replaces the stash / checkout / fix / checkout / `stash pop` dance. You get a *second* working directory, backed by the same repository, on a different branch, so your dirty feature work stays exactly as it was.",
    "front": "What problem does `git worktree` solve?",
    "topic": "Worktrees"
  },
  {
